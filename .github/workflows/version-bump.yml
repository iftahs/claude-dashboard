name: Auto version bump and changelog

# On each PR into main this does two things, in one run, on the PR's OWN branch:
#   1. Bumps the patch version in package.json (once per PR), so once the PR merges
#      main carries a fresh version and the in-app "update available" banner fires.
#   2. Builds a matching CHANGELOG.md entry from the PR's commit subjects with
#      scripts/changelog-entry.mjs (feat -> Added, fix -> Fixed, the rest -> Changed).
#
# Both run in the SAME job, triggered by your push — NOT in a second workflow.
# That's deliberate: a push made with GITHUB_TOKEN does not trigger new workflow
# runs, so a separate changelog workflow would never fire after the bump push.
#
# No AI and no external service: the entry is plain code over `git log`, and the bump
# is pushed even if that step fails. A hand-written `## [x.y.z]` entry for the PR's
# version that is already on the branch wins — it is kept as-is and nothing is added.
#
# Nothing is pushed to protected main. Runs only for same-repo branches (the token
# can't push to forks — fork PRs should bump + changelog manually).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-changelog-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump patch version once per PR
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Compare this branch's version against main. If they already differ, the
          # bump for this PR has happened — keep the existing version. (A re-run from
          # a later push is then a no-op for the bump.)
          git fetch origin main
          MAIN_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          HEAD_VERSION=$(node -p "require('./package.json').version")

          if [ "$HEAD_VERSION" = "$MAIN_VERSION" ]; then
            NEW_VERSION=$(npm version patch --no-git-tag-version)
            NEW_VERSION=${NEW_VERSION#v}
            git commit -am "chore: bump version to v$NEW_VERSION"
            echo "Bumped $MAIN_VERSION -> $NEW_VERSION."
          else
            NEW_VERSION=$HEAD_VERSION
            echo "Version already bumped for this PR ($NEW_VERSION)."
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Generate a changelog entry only if one for this version doesn't exist yet.
          if [ -f CHANGELOG.md ] && grep -q "## \[$NEW_VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG already has an entry for $NEW_VERSION."
            echo "gen=false" >> "$GITHUB_OUTPUT"
          else
            echo "gen=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the changelog entry from the PR's commits
        if: steps.bump.outputs.gen == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A branch cut before the script existed runs main's copy.
          SCRIPT=scripts/changelog-entry.mjs
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT="$RUNNER_TEMP/changelog-entry.mjs"
            git show origin/main:scripts/changelog-entry.mjs > "$SCRIPT"
          fi
          node "$SCRIPT" --version "$VERSION" --base origin/main

          git add CHANGELOG.md
          if ! git diff --cached --quiet -- CHANGELOG.md; then
            git commit -m "docs: update changelog for v$VERSION"
          fi

      # Runs even when the changelog step failed, so the bump is never lost; with
      # nothing new to push, git push is a no-op that exits 0.
      - name: Push version + changelog to the PR branch
        if: ${{ !cancelled() && steps.bump.outcome == 'success' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin "HEAD:$HEAD_REF"
