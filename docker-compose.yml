services:
  dashboard:
    build:
      context: .
      args:
        # Set VITE_DISABLE_ANALYTICS=1 in your .env to opt out of anonymous
        # product analytics at build time (see .env.example). Empty = analytics on.
        VITE_DISABLE_ANALYTICS: "${VITE_DISABLE_ANALYTICS:-}"
        # Forks: point analytics at your OWN PostHog project instead of the
        # author's. Empty falls back to the default token/host (see .env.example).
        VITE_POSTHOG_TOKEN: "${VITE_POSTHOG_TOKEN:-}"
        VITE_POSTHOG_HOST: "${VITE_POSTHOG_HOST:-}"
        # Set WITH_CLAUDE_CLI=1 in your .env to bundle the Claude Code CLI so AI
        # Insights can run `claude -p` in the container (uses your mounted token,
        # avoids the rate-limited OAuth Messages path). Adds ~size to the image.
        WITH_CLAUDE_CLI: "${WITH_CLAUDE_CLI:-}"
    image: claude-dashboard
    container_name: claude-dashboard
    ports:
      - "8787:8787"
    volumes:
      # Mount your real ~/.claude into the container, read-only.
      # Set CLAUDE_DIR_HOST in a .env file (see .env.example).
      - "${CLAUDE_DIR_HOST}:/data/.claude:ro"
      # Claude Cowork (desktop "local agent mode") data, read-only. Optional:
      # if COWORK_DIR_HOST is unset it falls back to .claude, which contains no
      # nested .claude/projects transcripts at the scanned depth → zero cowork
      # events (harmless) and the container still boots. See .env.example.
      - "${COWORK_DIR_HOST:-${CLAUDE_DIR_HOST}}:/data/cowork:ro"
      # OpenAI Codex (the ChatGPT desktop app's coding agent) data, read-only.
      # Optional: `npm run docker:up` writes CODEX_DIR_HOST=~/.codex into .env when
      # that folder exists; blank it to opt out. Unset, it falls back to .claude,
      # which holds no rollout-*.jsonl files → zero codex events, container still
      # boots. Only sessions/**/rollout-*.jsonl, session_index.jsonl and auth.json
      # (for the live limits call) are ever read.
      - "${CODEX_DIR_HOST:-${CLAUDE_DIR_HOST}}:/data/.codex:ro"
      # ~/.claude.json (bypassPermissionsModeAccepted etc.), read-only. Optional:
      # CLAUDE_JSON_HOST is written to .env automatically by `npm run docker:up`;
      # when unset this falls back to mounting the .claude DIR here, which the
      # backend detects (not a file) and treats as "can't determine".
      - "${CLAUDE_JSON_HOST:-${CLAUDE_DIR_HOST}}:/data/claude-json:ro"
      # Parsed-scan cache. MUST be a named volume, not a bind or an anonymous one:
      # `npm run docker:up` runs `up -d --build`, which replaces the container, and
      # anything on the container filesystem is discarded with it. This volume is
      # what makes a restart cost ~1s instead of re-parsing ~1.1 GB of JSONL (~10s).
      # Safe to delete at any time — it is a cache and rebuilds itself:
      #   docker compose down && docker volume rm claude-dashboard-cache
      - "claude-dashboard-cache:/cache"
    environment:
      - CLAUDE_DIR=/data/.claude
      - COWORK_DIR=/data/cowork
      - CODEX_DIR=/data/.codex
      - SERVER_PORT=8787
      - APP_RUNTIME=docker
      # AI Insights (chat + per-section buttons). In Docker there's no `claude`
      # CLI, so set ANTHROPIC_API_KEY in .env for a dedicated, un-throttled
      # backend. Unset → falls back to the Claude.ai OAuth token (works, but is
      # rate-limited → may 429). AI_MODEL is optional (default claude-opus-5).
      # To route through a corporate LLM proxy (LiteLLM / gateway) instead, set
      # ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN in .env (the token is sent as a
      # bearer Authorization header). Host shell vars are NOT auto-passed, so they
      # must be listed here. Set AI_MODEL if the proxy doesn't serve claude-opus-5.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - AI_MODEL=${AI_MODEL:-}
      # OPTIONAL — when on a LiteLLM proxy, the dashboard shows the gateway's ACTUAL
      # billed cost beside the estimate. By default it reuses ANTHROPIC_BASE_URL +
      # ANTHROPIC_AUTH_TOKEN; set these only if the spend-read key/url differs.
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      # OPTIONAL — absolute HOST path of this repo (e.g. E:\dev-projects\claude-dashboard).
      # Auto-resume uses it to render a copy-paste `node .../resume-watcher.mjs` command
      # on the Auto-Resume page. The container can't discover the host path itself.
      - HOST_REPO_DIR=${HOST_REPO_DIR:-}
      # Container path of the ~/.claude.json mount above (bypass detection).
      - CLAUDE_JSON=/data/claude-json
      # Day buckets follow the container clock — pin it to your local timezone
      # (override TZ in .env if you are not in Asia/Jerusalem).
      - TZ=${TZ:-Asia/Jerusalem}
    # Always available: restarts on crash and on machine reboot
    # (as long as Docker Desktop is set to start at login).
    restart: unless-stopped

volumes:
  # Named so it persists across `docker compose up --build`. See the mount above.
  claude-dashboard-cache:
